name: Build and publish fda-recall-monitor

on:
  push:
    branches: [main]
    paths:
      - 'fda-recall-monitor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get add-on version
        id: version
        run: echo "version=$(grep '^version:' fda-recall-monitor/config.yaml | sed 's/version: *//;s/"//g')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: home-assistant/builder@master
        with:
          args: |
            --amd64 \
            --target /data/fda-recall-monitor \
            --image "{arch}-addon-fda-recall-monitor" \
            --docker-hub "ghcr.io/jasonkaz" \
            --version "${{ steps.version.outputs.version }}"
